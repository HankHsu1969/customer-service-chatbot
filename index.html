<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧客服助理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f8f4ef;
    --cream: #ede8e0;
    --accent: #c9433a;
    --gold: #d4a853;
    --soft: #8e8c87;
    --bubble-user: #1a1a2e;
    --bubble-bot: #ffffff;
    --shadow: 0 4px 24px rgba(26,26,46,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    font-family: 'DM Sans', 'Noto Serif TC', sans-serif;
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  /* Header */
  header {
    width: 100%;
    background: var(--ink);
    padding: 18px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  header::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      45deg, transparent, transparent 20px,
      rgba(212,168,83,0.04) 20px, rgba(212,168,83,0.04) 40px
    );
  }
  .logo-mark {
    width: 38px; height: 38px;
    background: var(--accent); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0; position: relative; z-index: 1;
  }
  .header-text { position: relative; z-index: 1; }
  .header-text h1 {
    font-family: 'Noto Serif TC', serif;
    color: #fff; font-size: 1.15rem; font-weight: 700;
  }
  .header-text p { color: var(--gold); font-size: 0.74rem; font-weight: 300; margin-top: 1px; }
  .status-dot {
    width: 8px; height: 8px; background: #4ade80; border-radius: 50%;
    margin-left: auto; position: relative; z-index: 1;
    box-shadow: 0 0 0 3px rgba(74,222,128,0.25);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 3px rgba(74,222,128,0.25); }
    50%      { box-shadow: 0 0 0 6px rgba(74,222,128,0.1); }
  }

  /* App container */
  .app-container {
    width: 100%; max-width: 900px;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px 20px 16px;
    overflow: hidden;
  }

  /* Upload bar — compact single line */
  .upload-bar {
    flex-shrink: 0;
    background: #fff;
    border: 1.5px solid var(--cream);
    border-radius: 12px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .upload-bar .icon { font-size: 18px; flex-shrink: 0; }
  .upload-bar .label { font-size: 0.84rem; color: var(--soft); flex: 1; }
  .upload-bar .label strong { color: var(--ink); }

  .upload-btn {
    background: var(--ink); color: #fff; border: none;
    padding: 6px 16px; border-radius: 8px; font-size: 0.81rem;
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background 0.2s; flex-shrink: 0;
  }
  .upload-btn:hover { background: #2d2d5e; }
  #file-input { display: none; }

  /* Success / error badge */
  .upload-badge {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 0.81rem;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .upload-badge.success { display: flex; background: #f0fdf4; color: #166534; border: 1px solid #86efac; }
  .upload-badge.error   { display: flex; background: #fff5f5; color: #991b1b; border: 1px solid #fca5a5; }

  /* Chat wrapper — fills remaining space */
  .chat-wrapper {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    margin-top: 12px;
    background: #fff;
    border-radius: 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--cream);
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--cream); border-radius: 4px; }

  /* Welcome */
  .welcome-msg { text-align: center; padding: 40px 20px; color: var(--soft); }
  .welcome-icon { font-size: 46px; margin-bottom: 10px; }
  .welcome-msg h2 {
    font-family: 'Noto Serif TC', serif; color: var(--ink);
    font-size: 1.05rem; margin-bottom: 6px;
  }
  .welcome-msg p { font-size: 0.84rem; line-height: 1.7; }

  /* Bubbles */
  .msg-row { display: flex; gap: 10px; align-items: flex-end; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .avatar.bot  { background: var(--ink); }
  .avatar.user { background: var(--accent); }

  .bubble {
    max-width: 72%; padding: 11px 15px;
    border-radius: 17px; font-size: 0.9rem; line-height: 1.65;
  }
  .bubble.bot {
    background: #fff; border: 1px solid var(--cream);
    border-bottom-left-radius: 4px; color: var(--ink);
  }
  .bubble.bot p { margin: 0 0 7px; }
  .bubble.bot p:last-child { margin-bottom: 0; }
  .bubble.user { background: var(--ink); border-bottom-right-radius: 4px; color: #fff; }

  .bubble-time { font-size: 0.67rem; color: var(--soft); margin-top: 3px; }
  .msg-row.user .bubble-time { text-align: right; }

  /* Typing */
  .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 12px 16px; }
  .typing-dot {
    width: 6px; height: 6px; background: var(--soft);
    border-radius: 50%; animation: typing 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%,60%,100% { transform:translateY(0); opacity:0.4; }
    30% { transform:translateY(-5px); opacity:1; }
  }

  /* Input */
  .input-area {
    padding: 12px 14px; border-top: 1px solid var(--cream);
    display: flex; gap: 10px; align-items: flex-end;
    background: #fff; border-radius: 0 0 16px 16px;
    flex-shrink: 0;
  }
  .input-wrap {
    flex: 1; background: var(--paper); border: 1.5px solid var(--cream);
    border-radius: 11px; padding: 9px 13px; transition: border-color 0.2s;
  }
  .input-wrap:focus-within { border-color: var(--ink); }
  #user-input {
    width: 100%; border: none; background: transparent;
    font-family: inherit; font-size: 0.91rem; color: var(--ink);
    resize: none; outline: none; max-height: 110px; line-height: 1.5;
  }
  #user-input::placeholder { color: #bbb; }

  .send-btn {
    width: 42px; height: 42px; background: var(--ink); border: none;
    border-radius: 11px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) { background: var(--accent); transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .send-btn svg { width: 17px; height: 17px; fill: #fff; }

  .notice {
    text-align: center; padding: 9px; font-size: 0.73rem;
    color: var(--soft); border-top: 1px solid var(--cream); flex-shrink: 0;
  }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    .app-container { padding: 10px 12px 12px; }
    .bubble { max-width: 86%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-mark">🎯</div>
  <div class="header-text">
    <h1>智慧客服助理</h1>
    <p>AI-Powered Customer Service · Powered by Claude</p>
  </div>
  <div class="status-dot"></div>
</header>

<div class="app-container">

  <!-- 上傳列（精簡單行） -->
  <div class="upload-bar" id="upload-bar">
    <span class="icon">📄</span>
    <span class="label"><strong>Q&amp;A 知識庫</strong>｜請上傳 .txt 格式文字檔</span>
    <div class="upload-badge" id="upload-badge"></div>
    <button class="upload-btn" onclick="document.getElementById('file-input').click()">選擇檔案</button>
    <input type="file" id="file-input" accept=".txt">
  </div>

  <!-- 聊天區 -->
  <div class="chat-wrapper">
    <div class="chat-messages" id="chat-messages">
      <div class="welcome-msg" id="welcome-msg">
        <div class="welcome-icon">👋</div>
        <h2>您好，我是智慧客服助理</h2>
        <p>請先上傳您的 Q&amp;A 知識庫文字檔<br>我將根據其中的內容，為您提供詳細且有禮貌的回答</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="user-input" rows="1" placeholder="請輸入您的問題..." disabled></textarea>
      </div>
      <button class="send-btn" id="send-btn" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

    <div class="notice">此服務由 Claude AI 提供支援 · 回答僅供參考</div>
  </div>

</div>

<script>
let qaContent = '';
let isProcessing = false;
let conversationHistory = [];

// ── 上傳檔案 ─────────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) loadFile(file);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      qaContent = e.target.result;
      if (!qaContent.trim()) throw new Error('檔案是空的');
      showBadge('success', '✅ ' + file.name + ' 載入成功');
      enableChat();
    } catch (err) {
      showBadge('error', '❌ 載入失敗：' + err.message);
    }
  };
  reader.onerror = () => showBadge('error', '❌ 讀取失敗，請重試');
  reader.readAsText(file, 'UTF-8');
}

function showBadge(type, text) {
  const badge = document.getElementById('upload-badge');
  badge.className = 'upload-badge ' + type;
  badge.textContent = text;
}

function enableChat() {
  document.getElementById('user-input').disabled = false;
  document.getElementById('user-input').placeholder = '請輸入您的問題...';
  document.getElementById('send-btn').disabled = false;
  document.getElementById('welcome-msg')?.remove();
  addBotMessage('您好！我已成功讀取 Q&A 知識庫 📚\n\n我將根據知識庫內容，為您提供詳細、有禮貌的回答。請問有什麼我可以幫助您的嗎？');
}

// ── 對話 ─────────────────────────────────────────────────────────────────
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110) + 'px';
});
sendBtn.addEventListener('click', sendMessage);

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isProcessing || !qaContent) return;

  input.value = '';
  input.style.height = 'auto';
  isProcessing = true;
  sendBtn.disabled = true;

  addUserMessage(text);
  const typingId = addTyping();
  conversationHistory.push({ role: 'user', content: text });

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `你是一位專業、有禮貌且熱心的客服助理。

以下是你的 Q&A 知識庫：
---
${qaContent}
---

回答規則：
1. 優先參考知識庫中的內容來回答問題
2. 回答要有禮貌、詳細、親切，讓客戶感受到被重視
3. 如果知識庫沒有相關資訊，誠實告知並建議聯繫相關人員
4. 使用繁體中文回答
5. 適當使用條列或分段讓回答更清晰
6. 開頭可先確認理解用戶問題，結尾可詢問是否有其他問題`,
        messages: conversationHistory
      })
    });

    removeTyping(typingId);

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const reply = data.content?.[0]?.text || '抱歉，無法取得回答。';
    conversationHistory.push({ role: 'assistant', content: reply });
    addBotMessage(reply);

  } catch (err) {
    removeTyping(typingId);
    addBotMessage(`抱歉，發生了錯誤：${err.message}\n\n請確認您的網路連線，或稍後再試。`);
    conversationHistory.pop();
  }

  isProcessing = false;
  sendBtn.disabled = false;
  input.focus();
}

// ── UI helpers ────────────────────────────────────────────────────────────
function addUserMessage(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div>
      <div class="bubble user">${esc(text).replace(/\n/g,'<br>')}</div>
      <div class="bubble-time">${now()}</div>
    </div>
    <div class="avatar user">👤</div>`;
  append(row);
}

function addBotMessage(text) {
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="avatar bot">🤖</div>
    <div>
      <div class="bubble bot">${fmt(text)}</div>
      <div class="bubble-time">${now()}</div>
    </div>`;
  append(row);
}

function addTyping() {
  const id = 'typing-' + Date.now();
  const row = document.createElement('div');
  row.className = 'msg-row'; row.id = id;
  row.innerHTML = `
    <div class="avatar bot">🤖</div>
    <div class="bubble bot">
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>`;
  append(row);
  return id;
}

function removeTyping(id) { document.getElementById(id)?.remove(); }

function append(el) {
  const c = document.getElementById('chat-messages');
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
}

function now() {
  return new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
}

function esc(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmt(text) {
  return esc(text)
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>')
    .replace(/^/,'<p>')
    .replace(/$/,'</p>');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧客服助理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f8f4ef;
    --cream: #ede8e0;
    --accent: #c9433a;
    --gold: #d4a853;
    --soft: #8e8c87;
    --bubble-user: #1a1a2e;
    --bubble-bot: #ffffff;
    --shadow: 0 4px 24px rgba(26,26,46,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    font-family: 'DM Sans', 'Noto Serif TC', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    background: var(--ink);
    padding: 28px 40px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      45deg, transparent, transparent 20px,
      rgba(212,168,83,0.04) 20px, rgba(212,168,83,0.04) 40px
    );
  }

  .logo-mark {
    width: 44px; height: 44px;
    background: var(--accent);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    position: relative; z-index: 1;
  }

  .header-text { position: relative; z-index: 1; }

  .header-text h1 {
    font-family: 'Noto Serif TC', serif;
    color: #fff;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .header-text p {
    color: var(--gold);
    font-size: 0.78rem;
    font-weight: 300;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  .status-dot {
    width: 8px; height: 8px;
    background: #4ade80;
    border-radius: 50%;
    margin-left: auto;
    position: relative; z-index: 1;
    box-shadow: 0 0 0 3px rgba(74,222,128,0.25);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(74,222,128,0.25); }
    50% { box-shadow: 0 0 0 6px rgba(74,222,128,0.1); }
  }

  .app-container {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 97px);
    padding: 0 20px 20px;
  }

  /* Status bar */
  .status-bar {
    margin-top: 16px;
    padding: 11px 18px;
    border-radius: 12px;
    font-size: 0.84rem;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.4s;
  }
  .status-bar.loading { background: #fff; border: 1px solid var(--cream); color: var(--soft); }
  .status-bar.success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
  .status-bar.error   { background: #fffbee; border: 1px solid #f0d58a; color: #8a6900; }
  .status-bar.hidden  { display: none; }

  /* Manual upload (fallback) */
  .upload-section {
    margin-top: 10px;
    background: #fff;
    border: 2px dashed var(--cream);
    border-radius: 16px;
    padding: 16px 20px;
    display: none;
    transition: all 0.3s;
  }
  .upload-section.show { display: block; }
  .upload-section.has-file { border: 2px solid var(--gold); background: #fffdf6; }
  .upload-section.drag-over { border-color: var(--accent); background: #fff5f4; }

  .upload-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .upload-label { font-size: 0.85rem; color: var(--soft); flex: 1; }
  .upload-label strong { color: var(--ink); }
  .upload-label code { background: var(--cream); padding: 1px 5px; border-radius: 4px; font-size: 0.82em; }

  .upload-btn {
    background: var(--ink); color: #fff; border: none;
    padding: 7px 16px; border-radius: 8px; font-size: 0.82rem;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .upload-btn:hover { background: #2d2d5e; }
  #file-input { display: none; }

  .file-info {
    margin-top: 10px; padding: 10px 14px;
    background: var(--paper); border-radius: 8px;
    font-size: 0.82rem; color: var(--ink);
    display: none; align-items: flex-start; gap: 10px;
  }
  .file-info.show { display: flex; }

  .file-preview {
    flex: 1; max-height: 70px; overflow-y: auto;
    white-space: pre-wrap; color: var(--soft);
    font-size: 0.76rem; line-height: 1.5;
  }

  .qa-count {
    display: inline-block; background: var(--accent); color: #fff;
    border-radius: 20px; padding: 2px 10px;
    font-size: 0.75rem; font-weight: 500; white-space: nowrap;
  }

  /* Chat */
  .chat-wrapper {
    flex: 1; overflow: hidden; display: flex;
    flex-direction: column; margin-top: 14px;
    background: #fff; border-radius: 16px;
    box-shadow: var(--shadow); border: 1px solid var(--cream);
  }

  .chat-messages {
    flex: 1; overflow-y: auto; padding: 24px 20px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--cream); border-radius: 4px; }

  .welcome-msg { text-align: center; padding: 40px 20px; color: var(--soft); }
  .welcome-icon { font-size: 48px; margin-bottom: 12px; }
  .welcome-msg h2 {
    font-family: 'Noto Serif TC', serif; color: var(--ink);
    font-size: 1.1rem; margin-bottom: 6px;
  }
  .welcome-msg p { font-size: 0.85rem; line-height: 1.7; }

  .msg-row { display: flex; gap: 10px; align-items: flex-end; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .avatar.bot  { background: var(--ink); }
  .avatar.user { background: var(--accent); }

  .bubble {
    max-width: 72%; padding: 12px 16px;
    border-radius: 18px; font-size: 0.9rem; line-height: 1.65;
  }
  .bubble.bot {
    background: var(--bubble-bot); border: 1px solid var(--cream);
    border-bottom-left-radius: 4px; color: var(--ink);
  }
  .bubble.bot p { margin: 0 0 8px; }
  .bubble.bot p:last-child { margin-bottom: 0; }
  .bubble.user {
    background: var(--bubble-user);
    border-bottom-right-radius: 4px; color: #fff;
  }

  .bubble-time { font-size: 0.68rem; color: var(--soft); margin-top: 4px; }
  .msg-row.user .bubble-time { text-align: right; }

  .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }
  .typing-dot {
    width: 7px; height: 7px; background: var(--soft);
    border-radius: 50%; animation: typing 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-area {
    padding: 14px 16px; border-top: 1px solid var(--cream);
    display: flex; gap: 10px; align-items: flex-end;
    background: #fff; border-radius: 0 0 16px 16px;
  }
  .input-wrap {
    flex: 1; background: var(--paper); border: 1.5px solid var(--cream);
    border-radius: 12px; padding: 10px 14px; transition: border-color 0.2s;
  }
  .input-wrap:focus-within { border-color: var(--ink); }

  #user-input {
    width: 100%; border: none; background: transparent;
    font-family: inherit; font-size: 0.92rem; color: var(--ink);
    resize: none; outline: none; max-height: 120px; line-height: 1.5;
  }
  #user-input::placeholder { color: #bbb; }

  .send-btn {
    width: 44px; height: 44px; background: var(--ink);
    border: none; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) { background: var(--accent); transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; fill: #fff; }

  .notice {
    text-align: center; padding: 10px; font-size: 0.76rem;
    color: var(--soft); border-top: 1px solid var(--cream);
  }
  .notice a { color: var(--accent); text-decoration: none; }

  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    header { padding: 20px; }
    .app-container { padding: 0 12px 12px; }
    .bubble { max-width: 88%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-mark">🎯</div>
  <div class="header-text">
    <h1>智慧客服助理</h1>
    <p>AI-Powered Customer Service · Powered by Claude</p>
  </div>
  <div class="status-dot"></div>
</header>

<div class="app-container">

  <!-- Status bar -->
  <div class="status-bar loading" id="status-bar">
    <span class="spin">⏳</span>
    <span id="status-text">正在自動載入 Q&amp;A.txt…</span>
  </div>

  <!-- Manual upload (fallback, hidden until auto-load fails) -->
  <div class="upload-section" id="upload-section">
    <div class="upload-top">
      <span style="font-size:20px;">📂</span>
      <div class="upload-label">
        <strong>找不到 Q&amp;A.txt</strong>，請手動選擇檔案，<br>
        或將 <code>Q&amp;A.txt</code> 放在與此 HTML 相同目錄後重新整理頁面
      </div>
      <button class="upload-btn" onclick="document.getElementById('file-input').click()">選擇 .txt 檔案</button>
      <input type="file" id="file-input" accept=".txt">
    </div>
    <div class="file-info" id="file-info">
      <div>
        <div style="font-weight:500; margin-bottom:4px;" id="file-name-display"></div>
        <div class="file-preview" id="file-preview"></div>
      </div>
      <span class="qa-count" id="qa-count"></span>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-wrapper">
    <div class="chat-messages" id="chat-messages">
      <div class="welcome-msg" id="welcome-msg">
        <div class="welcome-icon">👋</div>
        <h2>您好，我是智慧客服助理</h2>
        <p>正在自動載入 Q&amp;A 知識庫，請稍候…</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="user-input" rows="1" placeholder="請輸入您的問題..." disabled></textarea>
      </div>
      <button class="send-btn" id="send-btn" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

    <div class="notice">
      此服務由 <a href="#">Claude AI</a> 提供支援 · 回答僅供參考
    </div>
  </div>
</div>

<script>
let qaContent = '';
let isProcessing = false;
let conversationHistory = [];

// ── 自動載入同目錄下的 Q&A.txt ───────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  fetch('Q&A.txt')
    .then(res => {
      if (!res.ok) throw new Error('not found');
      return res.text();
    })
    .then(text => {
      qaContent = text;
      setStatus('success', '✅ Q&amp;A.txt 已自動載入完成');
      displayFileInfo('Q&A.txt（自動載入）', text);
      enableChat();
      // 4 秒後隱藏狀態列
      setTimeout(() => document.getElementById('status-bar').classList.add('hidden'), 4000);
    })
    .catch(() => {
      setStatus('error', '⚠️ 找不到 Q&amp;A.txt，請手動選擇知識庫檔案');
      document.getElementById('upload-section').classList.add('show');
      // 更新歡迎訊息
      const wm = document.getElementById('welcome-msg');
      if (wm) wm.querySelector('p').textContent = '請先上傳 Q&A 知識庫，才能開始對話。';
    });
});

function setStatus(type, html) {
  const bar = document.getElementById('status-bar');
  bar.className = 'status-bar ' + type;
  bar.innerHTML = html;
}

// ── 手動上傳（備用）───────────────────────────────────────────────────────
const fileInput = document.getElementById('file-input');
const uploadSection = document.getElementById('upload-section');

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) loadFile(file);
});

uploadSection.addEventListener('dragover', e => { e.preventDefault(); uploadSection.classList.add('drag-over'); });
uploadSection.addEventListener('dragleave', () => uploadSection.classList.remove('drag-over'));
uploadSection.addEventListener('drop', e => {
  e.preventDefault();
  uploadSection.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.txt')) loadFile(file);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    qaContent = e.target.result;
    displayFileInfo(file.name, qaContent);
    setStatus('success', `✅ ${file.name} 載入完成`);
    enableChat();
    setTimeout(() => document.getElementById('status-bar').classList.add('hidden'), 4000);
  };
  reader.readAsText(file, 'UTF-8');
}

// ── 顯示檔案資訊 ─────────────────────────────────────────────────────────
function displayFileInfo(name, content) {
  const fileInfo = document.getElementById('file-info');
  fileInfo.classList.add('show');
  uploadSection.classList.add('has-file');
  document.getElementById('file-name-display').textContent = '📎 ' + name;
  const preview = content.length > 200 ? content.substring(0, 200) + '…' : content;
  document.getElementById('file-preview').textContent = preview;
  const qCount = (content.match(/^Q[:：]/gm) || []).length;
  document.getElementById('qa-count').textContent = qCount > 0 ? `${qCount} 組 Q&A` : '已載入';
}

// ── 啟用對話框 ───────────────────────────────────────────────────────────
function enableChat() {
  const inputEl = document.getElementById('user-input');
  inputEl.disabled = false;
  inputEl.placeholder = '請輸入您的問題...';
  document.getElementById('send-btn').disabled = false;

  const welcome = document.getElementById('welcome-msg');
  if (welcome) welcome.remove();

  addBotMessage('您好！我已成功讀取 Q&A 知識庫 📚\n\n我將根據知識庫內容，為您提供詳細、有禮貌的回答。請問有什麼我可以幫助您的嗎？');
}

// ── 對話邏輯 ─────────────────────────────────────────────────────────────
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
sendBtn.addEventListener('click', sendMessage);

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isProcessing || !qaContent) return;

  input.value = '';
  input.style.height = 'auto';
  isProcessing = true;
  sendBtn.disabled = true;

  addUserMessage(text);
  const typingId = addTyping();
  conversationHistory.push({ role: 'user', content: text });

  try {
    const systemPrompt = `你是一位專業、有禮貌且熱心的客服助理。

以下是你的 Q&A 知識庫：
---
${qaContent}
---

回答規則：
1. 優先參考知識庫中的內容來回答問題
2. 回答要有禮貌、詳細、親切，讓客戶感受到被重視
3. 如果知識庫沒有相關資訊，誠實告知並建議聯繫相關人員
4. 使用繁體中文回答
5. 適當使用條列或分段讓回答更清晰
6. 開頭可先確認理解用戶問題，結尾可詢問是否有其他問題`;

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: conversationHistory
      })
    });

    removeTyping(typingId);

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const reply = data.content?.[0]?.text || '抱歉，無法取得回答。';
    conversationHistory.push({ role: 'assistant', content: reply });
    addBotMessage(reply);

  } catch (err) {
    removeTyping(typingId);
    addBotMessage(`抱歉，發生了錯誤：${err.message}\n\n請確認您的網路連線，或稍後再試。`);
    conversationHistory.pop();
  }

  isProcessing = false;
  sendBtn.disabled = false;
  input.focus();
}

// ── UI helpers ───────────────────────────────────────────────────────────
function addUserMessage(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div>
      <div class="bubble user">${esc(text).replace(/\n/g,'<br>')}</div>
      <div class="bubble-time">${now()}</div>
    </div>
    <div class="avatar user">👤</div>`;
  append(row);
}

function addBotMessage(text) {
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.innerHTML = `
    <div class="avatar bot">🤖</div>
    <div>
      <div class="bubble bot">${fmt(text)}</div>
      <div class="bubble-time">${now()}</div>
    </div>`;
  append(row);
}

function addTyping() {
  const id = 'typing-' + Date.now();
  const row = document.createElement('div');
  row.className = 'msg-row';
  row.id = id;
  row.innerHTML = `
    <div class="avatar bot">🤖</div>
    <div class="bubble bot">
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>`;
  append(row);
  return id;
}

function removeTyping(id) { document.getElementById(id)?.remove(); }

function append(el) {
  const c = document.getElementById('chat-messages');
  c.appendChild(el);
  c.scrollTop = c.scrollHeight;
}

function now() {
  return new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
}

function esc(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmt(text) {
  return esc(text)
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>')
    .replace(/^/,'<p>')
    .replace(/$/, '</p>');
}
</script>
</body>
</html>
